name: Build Windows App

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hidapi pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name Type84_RGB type84_rgb.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Type84_RGB_Windows
          path: dist/Type84_RGB.exe
